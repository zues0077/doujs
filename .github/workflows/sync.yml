name: sync

# 追新判据是上游 lx-source.js 的 blob sha，不是仓库 head——
# 上游 head 每天会前进多次（docs / 巡检数据），但脚本可能一字未变。
# 所以这里每天跑一次、由 pipeline 自己判 NO_CHANGE，比按上游提交频率触发更省额度。
#
# 产物分发：只走 Release 附件，仓库树内不放任何 .js。
# 原因：GitHub 代码搜索只索引仓库内文件，Release 附件不被索引，这是「不被检索」的关键；
# 混淆只是提高二次分发门槛，不是防检索手段。

on:
  schedule:
    - cron: "17 3 * * *"        # 11:17 CST
  workflow_dispatch:
    inputs:
      force:
        description: "blob sha 未变也强制重建（改了锚点契约后用）"
        type: boolean
        default: false
      dry_run:
        description: "只跑门禁、不落盘、不发 Release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: doujs-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装构建期依赖（锁定版本，保证产物可复现）
        run: npm install --no-audit --no-fund

      - name: 拉取上游冒烟用例（不入库，避免把上游测试代码放进本仓库）
        # 上游地址不写死：owner/repo/branch 放在仓库 Variables，代码里只有变量名。
        # 这样全局代码搜索无法通过上游名反查到本仓库（Variables 不参与代码索引）。
        env:
          UP_REPO: ${{ vars.UPSTREAM_REPO }}
          UP_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'master' }}
        run: |
          if [ -z "$UP_REPO" ]; then
            echo "::error::未配置仓库 Variable UPSTREAM_REPO（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
          mkdir -p /tmp/upstream
          curl -sSL --retry 3 --max-time 60 \
            -o /tmp/upstream/lx-source-smoke-test.js \
            "https://raw.githubusercontent.com/${UP_REPO}/${UP_BRANCH}/test/lx-source-smoke-test.js"
          wc -c /tmp/upstream/lx-source-smoke-test.js
          # 上游 8.10.12 起冒烟用例直接 require 同仓 scripts/*.js（endpoint-registry 等）。
          # 只下载用例单文件会让 G4 崩在 MODULE_NOT_FOUND（58 组跑不完）——那是取材缺口，
          # 不是产物不兼容。这里整目录枚举供给；上游没有 scripts/ 时按无依赖处理，不报错。
          mkdir -p /tmp/upstream/scripts
          HTTP=$(curl -sSL --retry 3 --max-time 60 -o /tmp/upstream/scripts-list.json \
            -w '%{http_code}' \
            "https://api.github.com/repos/${UP_REPO}/contents/scripts?ref=${UP_BRANCH}")
          if [ "$HTTP" = "200" ]; then
            NAMES=$(python3 -c "import json;d=json.load(open('/tmp/upstream/scripts-list.json',encoding='utf-8'));print('\n'.join(x['name'] for x in d if isinstance(x,dict) and x.get('type')=='file' and str(x.get('name','')).endswith('.js')))")
            N=0
            for f in $NAMES; do
              curl -sSL --retry 3 --max-time 60 -o "/tmp/upstream/scripts/$f" \
                "https://raw.githubusercontent.com/${UP_REPO}/${UP_BRANCH}/scripts/$f" || exit 1
              N=$((N+1))
            done
            echo "上游 scripts/ 依赖：${N} 个文件"
            ls -la /tmp/upstream/scripts/
          else
            echo "上游无 scripts/ 目录（HTTP $HTTP），按无额外依赖处理"
            rmdir /tmp/upstream/scripts 2>/dev/null || true
          fi

      - name: 运行流水线（明文门禁 → 混淆 → 混淆后复验）
        id: pipe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'master' }}
        run: |
          set +e
          ARGS="--smoke-test /tmp/upstream/lx-source-smoke-test.js --profile medium"
          if [ -d /tmp/upstream/scripts ]; then ARGS="$ARGS --smoke-data /tmp/upstream/scripts"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python tools/pipeline.py $ARGS 2>&1 | tee /tmp/pipeline.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          STATUS=$(python -c "import json;print(json.load(open('reports/latest.json',encoding='utf-8')).get('status',''))" 2>/dev/null || echo unknown)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "退出码 $CODE / 状态 $STATUS（0=成功或无需重建，2=锚点漂移，3=门禁失败，4=拉取失败）"

      - name: 写 Job Summary
        if: always()
        run: |
          if [ -f reports/ci-summary.md ]; then cat reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 上传报告与失败现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: |
            reports/
            dist/
          retention-days: 30
          if-no-files-found: ignore

      - name: 发布 Release（产物唯一分发通道）
        if: steps.pipe.outputs.status == 'BUILD_OK' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(python -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          FN=$(python -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['filename'])")
          UP=$(python -c "import json;d=json.load(open('manifest.json',encoding='utf-8'));print(d['upstream']['blob_sha'][:8])")
          SHA=$(python -c "import json;d=json.load(open('manifest.json',encoding='utf-8'));print(d['product']['sha256'])")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同名 tag 已存在时必须比对资产内容，不能一律「跳过」：
            # 否则上游改了代码但没升 @version 时，产物会被静默丢弃，页面/清单指向旧文件。
            EXIST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[0].digest // ""')
            if [ -n "$EXIST" ] && [ "$EXIST" != "sha256:${SHA}" ]; then
              echo "::error::Release ${TAG} 已存在但资产 sha256 不一致（${EXIST} vs sha256:${SHA}）——版本号没有递增，新产物无法发布"
              exit 1
            fi
            echo "Release ${TAG} 已存在且资产一致（${EXIST}），跳过"
            exit 0
          fi
          if [ ! -f "dist/${FN}" ]; then echo "缺少产物 dist/${FN}"; exit 1; fi
          gh release create "$TAG" "dist/${FN}" \
            --title "${VERSION}" \
            --notes "upstream blob ${UP}

            sha256 \`${SHA}\`" \
            --latest

      - name: 提交状态（产物不入库）
        id: commit
        if: steps.pipe.outputs.status == 'BUILD_OK' && inputs.dry_run != true
        run: |
          set -e
          if git diff --quiet -- manifest.json state/state.json; then
            echo "状态无变化，不提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          UP=$(python -c "import json;d=json.load(open('manifest.json',encoding='utf-8'));print(d['upstream']['blob_sha'][:8])")
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add manifest.json state/state.json reports/latest.json
          git commit -m "chore: sync upstream ${UP} -> ${VERSION}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 漂移/门禁失败时开 Issue 提醒人工处理
        if: steps.pipe.outputs.code == '2' || steps.pipe.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 兜底创建 label：仓库 fork/重建时 label 不会跟着走，
          # 缺了它 gh issue create 会 422 失败 —— 告警链会静默断掉。
          gh label create anchor-drift --color d73a4a \
            --description "上游锚点失配：需人工按 Issue 清单更新 anchors.json" --force >/dev/null 2>&1 || true
          gh label create gate-failure --color d93f0b \
            --description "门禁失败：先看是否取材/依赖问题，勿直接改 anchors.json" --force >/dev/null 2>&1 || true
          UP=$(python -c "import json;print(json.load(open('reports/latest.json',encoding='utf-8'))['upstream']['blob_sha'][:8])" 2>/dev/null || echo unknown)
          # 两类失败必须分流（2026-11-08 教训：G4 因取材缺 MODULE_NOT_FOUND，
          # Issue 标题却写「需人工更新 anchors.json」，维护者按标题去改锚点会白忙半天）：
          #   code=2 → ANCHOR_DRIFT：补丁锚点真的失配，去更新 anchors.json
          #   code=3 → HARNESS_BROKEN/GATE_FAILED：锚点全过（本次 drift=0），先查
          #            取材/依赖（G4 kind=missing-deps）或真实断言失败
          if [ "${{ steps.pipe.outputs.code }}" = "2" ]; then
            LABEL="anchor-drift"
            TITLE="[sync] 上游漂移 ${UP}：需人工更新 anchors.json"
          else
            LABEL="gate-failure"
            KIND=$(python -c "import json;d=json.load(open('reports/latest.json',encoding='utf-8'));g=[x for x in (d.get('gates') or []) if 'G4' in str(x.get('name',''))];print((g[0].get('kind') if g and isinstance(g[0],dict) else '') or '')" 2>/dev/null || echo "")
            if [ "$KIND" = "missing-deps" ]; then
              TITLE="[sync] 门禁取材缺口 ${UP}：冒烟用例缺同仓依赖（勿改 anchors.json）"
            else
              TITLE="[sync] 门禁失败 ${UP}：GATE_FAILED（锚点 0 失配，勿改 anchors.json）"
            fi
          fi
          EXIST=$(gh issue list --label "$LABEL" --state open --json number,title \
                  --jq ".[] | select(.title | contains(\"${UP}\")) | .number" | head -1)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body-file reports/ci-summary.md
            echo "已追加到 Issue #$EXIST"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file reports/ci-summary.md
          fi

      - name: 构建成功后关闭遗留漂移/门禁 Issue
        if: steps.pipe.outputs.status == 'BUILD_OK' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for l in anchor-drift gate-failure; do
            for n in $(gh issue list --label "$l" --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "上游已重新对齐，门禁全部通过，产物已发布。"
            done
          done

      - name: 月度心跳（避免 public 仓库 60 天无提交被禁用定时）
        # GitHub 规则：public 仓库连续 60 天没有仓库活动，schedule 会被自动禁用。
        # 上游若长期不动脚本，追更就会**静默停更**。这里每月最多产生一次提交，
        # 把空窗压到 31 天以内；同月后续运行一律跳过，不污染历史。
        # 条件用 !cancelled() 而非 success()：漂移失败时更要保住定时任务本身还活着。
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          set -e
          OUT=$(python tools/heartbeat.py)
          echo "$OUT"
          if ! printf '%s' "$OUT" | grep -q 'RESULT=WRITE'; then
            echo "本月无需提交"
            exit 0
          fi
          MONTH=$(python -c "import json;print(json.load(open('state/heartbeat.json',encoding='utf-8'))['month'])")
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add state/heartbeat.json
          git commit -m "chore: monthly heartbeat ${MONTH}"
          git push

      - name: 失败时让 job 标红（报告已上传）
        if: steps.pipe.outputs.code != '0'
        run: |
          echo "流水线退出码 ${{ steps.pipe.outputs.code }}，详见 Job Summary 与 artifact"
          exit 1
